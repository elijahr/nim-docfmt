name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        nim-version: ['2.2.10', 'devel']
    steps:
      - uses: actions/checkout@v4
      - name: Setup Nim
        uses: elijahr/vfox-nim@main
        with:
          version: ${{ matrix.nim-version }}
      - name: Build and Test
        run: |
          nimble build -y -d:release
          nim c -r tests/t_docfmt.nim
      - name: Self Check
        run: |
          ./bin/nim-docfmt --check src/ tests/ || true
